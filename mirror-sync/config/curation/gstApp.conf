# gstApp 큐레이션 규칙 — bin/mirror-sync.sh 가 source 하는 bash 조각
# 실측일 2026-09-05 (personal-ops 이슈 #34 의 예고된 후속 — 두 번째 쌍).
#
# shellcheck shell=bash
# shellcheck disable=SC2034  # 다섯 축은 이 파일을 source 하는 bin/mirror-sync.sh 가 소비한다
#
# ── 실측 기준 ────────────────────────────────────────────────────────────────
#   upstream : /home/jhw/ai/opencode/projects/gstApp        master (77a2635) 파일 131개
#   mirror   : /home/jhw/ai/opencode/projects/gstApp-gitlab main   (cfaf40b) 파일 77개
#   교집합 76 · upstream 전용 55 · 미러 전용 1 · 공통 중 내용이 다른 것 1
#
# 기준 브랜치를 이렇게 고른 근거 (양쪽 다 로컬 체크아웃과 origin/HEAD 가 어긋난다):
#   upstream 로컬은 feature 브랜치 fix/87-split-at-running-time 에 체크아웃돼 있고
#   워킹트리가 dirty(7건) 다. 하지만 origin/HEAD → origin/master 이고 로컬 master 는
#   origin/master 와 같은 커밋(77a2635)이다. 싱크 기준은 feature 브랜치가 아니라
#   기본 브랜치이므로 **master** 를 쓴다.
#   mirror 는 origin/HEAD → origin/master 를 가리키지만 그 origin/master(10d65ea)는
#   로컬 main 과 **공통 조상이 아예 없는** 별개 히스토리다(GitLab 기본 브랜치가 아직
#   구 master 로 남아 있을 뿐이다). 로컬 main 은 origin/main 을 추적하고 그보다 18
#   커밋 앞서 있으며(origin/main 은 main 의 조상), 그 18개가 지금까지의 큐레이션 싱크
#   커밋이다. 따라서 미러 기준은 **main** 이다 — max9296 쌍과 같은 형태이고,
#   pairs.tsv 7번째 컬럼(mirror_branch)에 main 을 적어야 --apply 의 브랜치 검사를
#   통과한다. origin/HEAD 가 master 를 가리키는 것은 여기서 무시한다(근거는 위).
#   주의: 로컬 main 이 origin/main 보다 18 커밋 앞서 있으므로, 이 실측은 **아직
#   push 되지 않은 로컬 미러 HEAD** 를 기준으로 한 값이다. 스크립트도 로컬
#   워킹트리·인덱스를 대상으로 동작하므로 기준이 일치한다.
#
# ── 형식을 bash 배열로 고른 이유 ──────────────────────────────────────────────
# max9296.conf 와 같다. 축을 "공백 구분 문자열 하나"로 두면 항목 1개짜리 축이 되어
# 어떤 경로와도 매칭하지 않고, 그 실패는 조용하다(에러 없이 "미반입 0건"으로 전량
# 복사된다). 스크립트는 source 전에 다섯 축을 unset 하고 source 직후 declare -p 로
# **선언 타입**을 확인해 배열이 아니면 종료 코드 2 로 거부한다.
# 이 저장소에는 공백·괄호·& ·= 가 들어간 경로가 없지만(2026-09-05 실측), 형식은
# max9296 과 맞춰 둔다 — 나중에 그런 파일이 생겨도 규칙을 바꿀 필요가 없다.
#
# ── 경로 매칭 규칙 (스크립트 glob_to_ere() 와 문자 그대로 일치) ───────────────
#   *        경로 구분자 '/' 를 넘지 않는 임의 문자열   (ERE [^/]*)
#   **       '/' 를 포함한 임의 문자열                  (ERE .*)
#   ?        '/' 가 아닌 한 글자                        (ERE [^/])
#   그 외    전부 리터럴. '.' 은 이스케이프되므로 'X.md' 가 'X.md.save' 를 매칭하지
#            않는다(아래 RECORDING_SYNC_PLAN 두 줄이 그래서 따로 있다).
#   패턴은 경로 **전체**에 앵커된다(^...$). 부분 문자열 매칭이 아니다.
#   따라서 디렉터리 전체는 '.github/**' 처럼 '/**' 를 붙여야 한다.
#   KEEP_MIRROR / UPSTREAM_ONLY / MIRROR_ONLY 세 축 모두 같은 규칙을 쓴다.
#
# ── 분류 우선순위 (스크립트 classify_path() 와 일치) ─────────────────────────
#   UPSTREAM_ONLY > MIRROR_ONLY > KEEP_MIRROR > (그 외) 복사

# ── KEEP_MIRROR — 양쪽에 다 있으나 내용이 의도적으로 다름 ────────────────────
# 덮어쓰기 금지. upstream 변경분은 사람이 읽고 수동 이식한다.
# 실측: 공통 76개 중 blob sha 가 다른 것은 **정확히 1개**다. 나머지 75개는 양쪽
# blob 이 바이트 단위로 같다. max9296(공통 64 중 6개 상이)과 달리 이 쌍의 큐레이션은
# 거의 전부 "파일을 빼는" 쪽으로 돼 있고 "파일을 고쳐 두는" 쪽은 이 한 개뿐이다.
KEEP_MIRROR=(
  ".gitignore"  # 미러가 5줄을 더 갖는다(17줄→22줄). upstream 전용 파일 .vscode/·
                # app.code-workspace·build.log 를 미러에서 무시하는 블록이며,
                # 그 세 경로는 아래 UPSTREAM_ONLY 에도 들어 있다 — 규칙(경로)과
                # 미러 .gitignore(내용)가 같은 정책을 두 겹으로 거는 형태다.
                # upstream 판으로 덮이면 그 블록이 통째로 사라지므로 KEEP 이다.
)

# ── UPSTREAM_ONLY — upstream 에만 존재. 미러로 반입 금지 ─────────────────────
# 실측 55개를 아래 20개 패턴이 정확히 덮는다.
# 검증(2026-09-05): upstream 전용 55/55 매치, **미러 77개 파일에 대한 오매치 0**.
# docs/ 를 'docs/**' 로 압축하지 **않은** 이유: 미러 docs/ 에도 파일이 5개 있다
# (CAMERA_SYNC_VALIDATION / CHANNEL_STARTUP_DIAGNOSTICS_HISTORY /
#  RECORDING_QP_STATISTICS / RTSP_CLIENT_SYNC_REQUIREMENTS / pim-package-binary).
# 'docs/**' 나 'docs/*.md' 로 압축하면 그 5개까지 잡아먹어 미러 파일이 "반입 금지"
# 로 분류되고, 특히 pim-package-binary.md 는 우선순위상 MIRROR_ONLY 보다 앞서는
# UPSTREAM_ONLY 로 빨려 들어가 ASSERT_A 가 첫 --apply 부터 빨개진다.
# 그래서 docs/ 직속 14개는 전부 개별 경로로 적는다.
UPSTREAM_ONLY=(
  ".github/**"                                        # GitHub Actions·PR 템플릿·copilot 지침 20개. GitLab 미러와 무관
  ".vscode/**"                                        # 편집기 로컬 설정 2개. 미러 .gitignore 도 같은 경로를 막는다
  "todos/**"                                          # 내부 보안 TODO 백로그 5개(명령 주입·하드코딩 키 등). 공개 미러에 둘 수 없다
  "docs/superpowers/**"                               # 내부 계획·설계 문서 12개(plans 7 + specs 5). FORBID 문자열의 출처
  "app.code-workspace"                                # VS Code 워크스페이스 파일. 미러 .gitignore 의 '*.code-workspace' 대상
  "build.log"                                         # 빌드 산출 로그. 미러 .gitignore 의 'build.log' 대상
  "docs/CAPTURE_OPTIMIZATIONS.md"                     # 내부 성능 조사 노트
  "docs/CODE_REVIEW_STATUS.md"                        # 내부 코드리뷰 진행표(todos/ 경로를 인용한다)
  "docs/CODE_REVIEW_SUMMARY.md"                       # 내부 코드리뷰 요약(github.com:jhw7500/ 원격 URL 포함)
  "docs/EDGE_CONFIG_ARRAYS.md"                        # 내부 설정 스펙 초안
  "docs/NEXT-PR-TASKS.md"                             # 다음 PR 작업 목록(.github/workflows/ 참조 포함)
  "docs/PERFORMANCE_OPTIMIZATION_PLAN.md"             # 내부 최적화 계획서
  "docs/PR38_REVIEW_FOLLOWUP_VALIDATION_20260814.md"  # 특정 PR 리뷰 후속 검증 기록
  "docs/RECORDING_SYNC_PLAN.md"                       # 내부 녹화 동기화 계획서
  "docs/RECORDING_SYNC_PLAN.md.save"                  # 위 파일의 편집기 백업본. '.md' 는 리터럴이라 위 패턴이 이걸 덮지 않는다
  "docs/RELEASE_NOTES_v1.3.md"                        # 내부 릴리스 노트(제거된 문서들을 링크한다)
  "docs/RELEASE_NOTES_v1.4.md"                        # 내부 릴리스 노트
  "docs/SECURITY-NOTES.md"                            # 보안 노트. 공개 미러에 둘 수 없다
  "docs/SPLITMUXSINK.md"                              # 내부 조사 노트
  "docs/WORK-NOTE.md"                                 # 세션 작업 로그(내부 기록)
)

# ── MIRROR_ONLY — 미러에만 존재. upstream 에 없다고 삭제 금지 ────────────────
# 실측 1개.
MIRROR_ONLY=(
  "docs/pim-package-binary.md"  # 회사 pim-package 에 들어간 gstApp 바이너리의 출처(커밋 ID·날짜)를
                                # 미러에서만 기록한다. upstream 에 대응 파일이 없다
)

# ── FORBID — 싱크 후 미러 추적 파일에 나타나면 안 되는 문자열 ────────────────
# 고정 문자열(grep -F)로 검사한다. 정규식이 아니다.
# 실측(2026-09-05): 아래 5종 모두 **미러 매치 0건**, upstream 매치 1~17 파일.
# 다섯 개 전부 UPSTREAM_ONLY 파일 안에서만 나오므로, 이 축은 경로 규칙이 오타 등으로
# 죽었을 때 내용 쪽에서 한 번 더 잡는 두 번째 그물이다(ASSERT_A 와 독립).
#
# ── max9296 과 달라진 점: 'PR #' 는 여기 쓸 수 없다 ──────────────────────────
# max9296.conf 는 'PR #' 와 'pull/' 를 FORBID 로 쓴다. 이 쌍에서는 둘 다 못 쓴다.
#   'PR #'   → 미러에 **이미 2건** 있다(docs/CHANNEL_STARTUP_DIAGNOSTICS_HISTORY.md:12,
#              test/run-split-skew-source-check.sh:89). 넣으면 첫 실행부터 ASSERT_B 실패다.
#   'pull/'  → upstream 에도 0건이라 아무것도 지키지 않는 죽은 문자열이다.
# 표본 하나로 만든 공용 목록을 그대로 옮기면 안 된다는 이슈 #34 의 지적이 여기서
# 그대로 재현됐다. 쌍마다 실측한다.
FORBID=(
  "docs/superpowers/"    # 미러에 없는 내부 계획문서 경로 참조 — 링크가 깨지고 내부 구조가 새어나간다
  ".github/workflows/"   # GitHub Actions 경로 참조. GitLab 미러에서 가리키는 곳이 없다
  "jhw7500/automation"   # 내부 공용 워크플로우 저장소 참조. 미러 이용자가 접근할 수 없다
  "github.com:jhw7500/"  # upstream 의 GitHub 원격 URL. 미러에 유입되면 잘못된 곳을 가리킨다
  "todos/"               # 내부 보안 TODO 백로그 경로 참조(취약점 항목 파일명이 그대로 드러난다)
)

# ── MUST_SURVIVE — 싱크 후에도 미러에 남아 있어야 하는 문자열 ────────────────
# 고정 문자열(grep -F)로 검사한다. 이슈 #34 사고(미러 고유 문단이 조용히 덮여 사라짐)
# 를 직접 막는 축이다.
# 아래 2종은 2026-09-05 실측으로 **미러에만 1건씩 있고 upstream master 전체 매치
# 0건**이다. 따라서 해당 파일이 upstream 판으로 덮이는 순간 ASSERT_C 가 빨개진다.
#
# ── 왜 KEEP_MIRROR 1개인데 문자열이 2개인가 ──────────────────────────────────
# [0] 은 max9296 과 같은 이유다: KEEP_MIRROR 의 보존은 "복사하지 않는다"로만 구현돼
#     있어서, 그 목록에서 줄이 빠지거나 경로가 바뀌어 매칭에 실패하면 upstream 판이
#     미러 판을 덮어써도 나머지 어서션이 전부 통과한다.
# [1] 은 이 쌍에서 새로 확인한 구멍이다. MIRROR_ONLY 는 ASSERT_D 가 지키지만, D 는
#     "패턴에 매칭하는 파일이 인덱스에 최소 1개 있는가"만 본다. 만약 upstream 이
#     나중에 같은 경로에 파일을 추가하고 그때 MIRROR_ONLY 항목이 오타 등으로 죽어
#     있으면, 그 파일은 복사로 분류돼 미러 판을 **덮어쓴다** — 파일은 그대로 존재하니
#     D 는 통과하고, 미러에 이미 있던 경로라 F 도 통과하며, 보고대로 스테이징됐으니
#     E 도 통과한다. 2026-09-04 사고와 정확히 같은 모양(조용한 내용 소실)이다.
#     그래서 MIRROR_ONLY 파일의 고유 문장도 하나 못박는다.
MUST_SURVIVE=(
  "# Local editor and generated build diagnostics"
  "바이너리를 확인할 때 필요한 고정값은"
)

# ── MUST_SURVIVE_IN — 위 문자열이 살아 있어야 하는 파일 (선택 축) ────────────
# MUST_SURVIVE 와 **같은 길이의 병렬 배열**이다. i 번째 원소가 MUST_SURVIVE[i] 의
# 요구 위치이고, 빈 문자열이면 저장소 전체에서 찾는다.
# 경로를 묶는 이유: 저장소 전체 검사는 같은 문구가 다른 파일에 우연히 생기면 정작
# 그 문단이 지워져도 통과한다. 이 축이 지키는 것은 "문구의 존재"가 아니라 "그 파일의
# 미러 고유 서술"이므로 파일에 못박는다. 길이가 다르면 스크립트가 코드 2 로 거부한다.
MUST_SURVIVE_IN=(
  ".gitignore"                  # 미러 판 15행. .vscode/·*.code-workspace·build.log 무시 블록의 머리글
  "docs/pim-package-binary.md"  # 미러 판 16행. 패키지 바이너리 식별에 무엇이 고정값인지 밝히는 문장
)
