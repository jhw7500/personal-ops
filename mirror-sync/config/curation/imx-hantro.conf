# imx-hantro 큐레이션 규칙 — bin/mirror-sync.sh 가 source 하는 bash 조각
# 2026-11-06 (이슈 #72): upstream master c37edf1 의 큐레이션 스냅샷으로 GitLab 미러를 시작했다.
# 미러에는 upstream 이력이 없다. GitLab 에는 빌드에 쓰는 소스·빌드 파일과 그 문서만 둔다
# (mirror-sync/README.md 의 "GitLab 최소화" 절).
# shellcheck shell=bash
# shellcheck disable=SC2034
#
# 미러는 upstream 트리에서 CHANGELOG.md 를 빼고 README.md 를 미러판으로 바꾼 것이다(나머지 9개는
# upstream 과 같다). 미러판 README 는 GitHub 저장소·이슈 링크를 빼고, 커밋 표가 이 미러가 아니라
# 개발 저장소의 커밋이라고 밝힌다.
#
# 경로 패턴: ** 는 / 포함 임의 문자열, * 는 / 를 넘지 않는 임의 문자열,
# ? 는 / 아닌 한 글자. 나머지는 리터럴이며 경로 전체에 매칭한다.
# 우선순위: UPSTREAM_ONLY > MIRROR_ONLY > KEEP_MIRROR > 일반 복사.

KEEP_MIRROR=(
  "README.md" # GitHub 링크를 빼고, 이력 없는 스냅샷에 맞지 않는 커밋·git log 안내를 고친 미러판
)

UPSTREAM_ONLY=(
  "CHANGELOG.md" # 아무도 인용하지 않는 변경 이력(imx-vpu 와 같은 처리)
)

# MIRROR_ONLY 는 조사한 뒤 비운 축이다(2026-11-06 실측: 미러 전용 0개, upstream 과 같은 공통 파일 9개,
# 내용이 다른 공통 파일은 README.md 하나, upstream 전용은 CHANGELOG.md 하나).
#   꺼진 것: 삭제 보호 목록이 없어 upstream 에서 지워진 경로는 미러에서도 지워지고, ASSERT_D 는 아무것도
#     검사하지 않는다(dry-run·--apply 에 [주의] 로 찍힌다).
#   대신 남는 방어선: README.md 는 KEEP_MIRROR 라 복사·삭제 대상이 아니고, README.md 에 묶은
#     MUST_SURVIVE(ASSERT_C)와 FORBID 의 github.com/jhw7500(ASSERT_B)가 미러판을 앵커한다.
#   남는 공백: 그 밖의 파일 삭제는 dry-run 표의 '복사 / 삭제' 행을 사람이 읽어야만 보인다. 미러 전용
#     파일을 새로 두면 MIRROR_ONLY 를 채우고 이 표식을 지운다.
MIRROR_ONLY=()
AXES_INTENTIONALLY_EMPTY=( MIRROR_ONLY )

# 보드 사설 주소 대역(모든 쌍 공통)과 GitHub 저장소 링크. 뒤의 것은 upstream 에서 README.md 에만 있어,
# upstream README 가 미러판을 덮으면 ASSERT_B 가 잡는 앵커다.
FORBID=(
  "192.168.214."
  "github.com/jhw7500"
)

# 미러판 README 에만 있는 문장이다.
MUST_SURVIVE=(
  "커밋 열은 이 미러가 아니라 개발 저장소의 커밋이다."
)
MUST_SURVIVE_IN=(
  "README.md"
)
