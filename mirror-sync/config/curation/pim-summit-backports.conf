# pim-summit-backports 큐레이션 규칙 — bin/mirror-sync.sh 가 source 하는 bash 조각
# 실측일 2026-09-05 (personal-ops 이슈 #41 — 이슈 #34 의 다섯 번째 쌍).
#
# shellcheck shell=bash
# shellcheck disable=SC2034  # 축들은 이 파일을 source 하는 bin/mirror-sync.sh 가 소비한다
#
# ── 기준 커밋 ────────────────────────────────────────────────────────────────
# upstream /home/jhw/ai/opencode/projects/pim-summit-backports        master   28997d8  (7개 파일)
# mirror   /home/jhw/ai/opencode/projects/pim-summit-backports-gitlab develop  badf083  (8개 파일)
# **미러 기본 브랜치가 main 이 아니라 develop 이다**(develop == main == badf083).
# pairs.tsv 6·7 컬럼은 master / develop 이다.
#
# ── 이 쌍의 성격: "큐레이션된 미러" 가 아니라 "뒤처진 미러" 다 ────────────────
# 두 저장소는 커밋 6605bac 까지 같은 이력을 공유하고 거기서 갈라졌다.
#   upstream 은 그 뒤 clangd 배선 커밋들(19a4378 … 28997d8)을 얹었고,
#   mirror   는 그 뒤 문서 2건(dff6438 · badf083)을 얹었다.
# 그래서 "내용이 다른 공통 파일" 3개 중 2개(.gitignore · make-for-imx8)는 미러 판이
# 분기점 6605bac 의 blob 과 **바이트 단위로 같다** — 미러가 큐레이션한 것이 아니라
# upstream 변경을 아직 못 받은 것이다(실측 blob: .gitignore 4bd7bd7 · make-for-imx8
# 9b4e2b2 가 develop 과 6605bac 양쪽에서 동일). 이 사실이 아래 빈 UPSTREAM_ONLY 의 근거다.
#
# ── 형식: max9296.conf 와 같은 bash 배열 ─────────────────────────────────────
# 이 저장소에는 공백·괄호가 들어간 경로가 없다(양쪽 15개 경로 전부 [A-Za-z0-9._/-]).
# 그래도 배열을 쓴다 — 스크립트가 declare -p 로 선언 타입을 검사해 배열이 아니면
# 종료 코드 2 로 거부하기 때문이다. 문자열로 쓰면 축이 항목 1개로 퇴화해 아무것도
# 매칭하지 않은 채 조용히 전량 복사된다. 새 항목은 반드시 따옴표로 감싼다.
#
# ── 경로 매칭 규칙 (스크립트 glob_to_ere() 와 문자 그대로 일치) ───────────────
#   *        경로 구분자 '/' 를 넘지 않는 임의 문자열   (ERE [^/]*)
#   **       '/' 를 포함한 임의 문자열                  (ERE .*)
#   ?        '/' 가 아닌 한 글자                        (ERE [^/])
#   그 외    전부 리터럴.
#   패턴은 경로 **전체**에 앵커된다(^...$). 부분 문자열 매칭이 아니다.
#
# ── 분류 우선순위 (스크립트 classify_path() 와 일치) ─────────────────────────
#   UPSTREAM_ONLY > MIRROR_ONLY > KEEP_MIRROR > (그 외) 복사

# ── KEEP_MIRROR — 양쪽에 다 있으나 내용이 다름 ───────────────────────────────
# 덮어쓰기 금지. upstream 변경분은 사람이 읽고 수동 이식한다.
# 실측: 공통 6개(.gitignore · README.md · env.sh · fetch.sh · make-for-imx8 · pack.sh)
# 중 blob sha 가 다른 것이 정확히 아래 3개다(같은 3개: env.sh · fetch.sh · pack.sh).
KEEP_MIRROR=(
  ".gitignore"      # upstream 이 clangd 산출물 무시 4줄(주석 + compile_commands.json + .cache/)을 더 갖는다 19줄→15줄. 미러 판은 upstream 판의 **순수 부분집합**
  "make-for-imx8"   # upstream 이 source-안전 종료(_mfi_end)·ERR trap·compile_commands.json 자동 갱신 블록을 더 갖는다 109줄→47줄. **이식하면 MUST_SURVIVE 2)번을 같이 지워라** — 아래 [알려진 공백] (1)
  "README.md"       # 미러에만 docs/pim-package-binary.md 안내 3줄이 있다 128줄→131줄. 차이는 전적으로 **미러 쪽 추가**(upstream README blob 404adfc 는 분기점 6605bac 와 동일)
)

# ── UPSTREAM_ONLY — 조사한 결과 비운 축 (이슈 #41) ───────────────────────────
# **실측 후보 0.** upstream 전용 파일은 `.clangd` 하나뿐이다(upstream 7 - 공통 6 = 1).
# 그런데 `.clangd` 는 2026-08-25 clangd 커밋들이 얹은 **upstream 신기능**이고 미러가
# 아직 받지 못한 것이다(위 "뒤처진 미러" 참조). "미러에 두지 않는다" 는 **정책적 사유가
# 없으므로** UPSTREAM_ONLY 에 넣으면 규칙이 아니라 오기록이 된다. 넣어 두면 미러가
# 언젠가 clangd 배선을 받을 때 그 반입을 이 파일이 막고, 왜 막는지 아무도 설명할 수
# 없는 상태가 된다.
#
# 그 대가로 **upstream 전용 파일이 전부 복사 대상이 된다**(ASSERT_A 는 패턴이 0개라
# 항상 통과한다). 남는 방어선은 ASSERT_F 다 — 미러에 없던 파일이 새로 들어오면
# `--apply` 가 `--allow-new` 승인을 요구한다. 즉 무방비는 아니지만, 그 승인은 사람이
# '신규 반입' 목록을 눈으로 읽는 것이 전부다. 스크립트가 매 실행에 이 사실을 [주의]
# 로 찍고(warn_intentionally_empty_axes), 미러 커밋 메시지에도 같은 줄을 남긴다.
# 이 conf 에서 비운 축은 이것 하나뿐이다.
UPSTREAM_ONLY=()

# ── MIRROR_ONLY — 미러에만 존재. upstream 에 없다고 삭제 금지 ────────────────
# 실측 2개(미러 8 - 공통 6 = 2). 둘 다 분기 후 미러 쪽 커밋이 추가한 문서다.
MIRROR_ONLY=(
  "docs/pim-package-binary.md"        # pim-package 의 laird_backport.tar 바이너리 기준. 미러 커밋 dff6438 이 추가. upstream 에 대응 파일 없음
  "docs/team-sharing-build-guide.md"  # 타팀 공유·빌드 안내(GitLab URL 기준). 미러 커밋 badf083 이 추가. upstream 에 대응 파일 없음
)

# ── FORBID — `.gitignore` 의 대칭 앵커 한 줄 ─────────────────────────────────
# 앵커가 될 수 있는 것은 upstream 에 있고 미러에 0건인 문자열뿐이다
# (2026-09-05 실측, 보유 **파일 수** upstream/mirror):
#     "clangd"                3 / 0   (.clangd · .gitignore · make-for-imx8)
#     "compile_commands.json" 3 / 0   (같은 3개 파일)
#     ".cache/"               1 / 0   (.gitignore 하나뿐)
#
# 앞의 두 문자열은 **`.clangd` 가 담고 있어 쓸 수 없다.** UPSTREAM_ONLY 가 비어 있으므로
# `.clangd` 는 복사 대상이고, `--allow-new` 로 승인해 반입하는 순간 ASSERT_B 가 확정적으로
# 실패해 `--apply` 가 영구히 불가능해진다.
# (참고: 이슈 #41 본문은 이 차단 요인을 `make-for-imx8` 로 적었으나, 그 파일은 위
#  KEEP_MIRROR 라 복사되지 않는다. 실제 차단 요인은 `.clangd` 다 — 2026-09-05 재실측.)
#
# 세 번째 ".cache/" 는 다르다. `.clangd` 본문에 없고(전문 확인) upstream 에서는
# `.gitignore` 에만 있다. 그래서 `.clangd` 를 반입해도 울지 않고, **KEEP_MIRROR 의
# `.gitignore` 가 upstream 판으로 덮이는 순간에만** 울린다. sc16is7xx.conf ·
# imx-vpu.conf 가 같은 파일에 쓰는 것과 같은 대칭 앵커다.
#
# 이 한 줄이 있어야 하는 이유: 미러 `.gitignore` 는 upstream 판의 **순수 부분집합**이라
# 미러 전용 문장이 원리적으로 없고, 따라서 MUST_SURVIVE 로는 앵커할 수 없다. 이 줄이
# 없으면 KEEP_MIRROR 목록에서 `.gitignore` 한 줄이 빠지거나 오타로 매칭이 깨질 때
# 어서션 6종이 전부 통과하며 미러 판이 조용히 덮인다(2026-09-05 스크래치 클론 실측:
# EXIT=0 · 6종 [PASS] · 커밋 생성 · 미러 .gitignore 가 upstream 판과 바이트 동일).
# README "새 쌍 추가" 2번의 "KEEP_MIRROR 마다 MUST_SURVIVE 또는 FORBID 로 앵커한다"
# 규약도 이 줄로 3/3 충족된다.
#
# 유효기간: 미러가 clangd 커밋을 받아 `.gitignore` 가 양쪽에서 같아지면 이 앵커는 첫
# 실행부터 빨개진다. 그때는 `.gitignore` 를 KEEP_MIRROR 에서 빼면서 이 줄도 같이 지운다.
FORBID=( ".cache/" )

# ── 조사한 결과 비운 축을 명시한다 (이슈 #41) ────────────────────────────────
# 이 선언이 없으면 스크립트가 빈 축을 종료 코드 2 로 거부한다 —
# "조사했고 비웠다" 와 "조사하지 않았다" 는 다른 정보인데 구분할 방법이 없기 때문이다.
# 이 표식은 "안전하다" 가 아니라 "사람이 알고 있다" 는 뜻이다. 스크립트는 표식이 있는
# 축이 무엇을 무력화하는지 dry-run·--apply 양쪽 출력에 [주의] 로 찍는다.
# 축 이름 오타·중복과 "표식에 있는데 비어 있지 않은 축"은 전부 종료 코드 2 로 거부된다.
# `declare` 를 붙이면 안 된다 — conf 는 함수 안에서 source 되므로 지역 변수가 되어
# 사라지고, 스크립트가 종료 코드 2 로 그 사실을 알린다.
#
# 이 conf 가 비운 축은 UPSTREAM_ONLY 하나다. FORBID 는 위 ".cache/" 한 줄을 쓴다.
AXES_INTENTIONALLY_EMPTY=( UPSTREAM_ONLY )

# ── MUST_SURVIVE — 싱크 후에도 미러에 남아 있어야 하는 문자열 ────────────────
# 고정 문자열(grep -F)로 검사한다. KEEP_MIRROR 의 보존은 "복사하지 않는다"로만 구현돼
# 있어, 목록에서 한 줄이 빠지거나 오타로 매칭에 실패하면 upstream 판이 미러 판을
# 덮어써도 어서션이 전부 통과한다. 그 구멍을 이 축이 막는다.
#
# 실측 (2026-09-05, 보유 **파일 수** upstream master / mirror develop):
#   1) "(docs/pim-package-binary.md)에 구분해 기록한다"          0 / 1
#   2) '[ -d "$SRC_DIR" ] || { … ; exit 1; }'                    1 / 2   ← 아래 주의
#   3) "이 저장소의 현재 빌드 기준은 PIM 양산 커널"              0 / 1
#   4) "타팀 저장소 공유 및 빌드 안내"                            0 / 1
#
# 2)번만 저장소 전체 기준으로 upstream 0건이 아니다 — 같은 한 줄이 양쪽 `pack.sh`
# (blob 29e0880, 양쪽 동일)에도 있다. 그래서 **MUST_SURVIVE_IN 으로 파일에 못박는 것이
# 이 항목에서는 선택이 아니라 필수다.** 구속하지 않으면 make-for-imx8 이 덮여도
# pack.sh 덕분에 ASSERT_C 가 영원히 통과한다.
# 구속 파일 기준으로 재보면 되돌리면 실패한다: upstream:make-for-imx8 **0건** /
# mirror:make-for-imx8 1건 (upstream 판은 같은 자리를 `"$_mfi_end" 1; }` 로 바꿨다).
MUST_SURVIVE=(
  "(docs/pim-package-binary.md)에 구분해 기록한다"
  '[ -d "$SRC_DIR" ] || { echo "소스가 없다. 먼저 ./fetch.sh" >&2; exit 1; }'
  "이 저장소의 현재 빌드 기준은 PIM 양산 커널"
  "타팀 저장소 공유 및 빌드 안내"
)

# ── MUST_SURVIVE_IN — 위 문자열이 살아 있어야 하는 파일 (선택 축) ────────────
# MUST_SURVIVE 와 **같은 길이의 병렬 배열**이다. 길이가 다르면 종료 코드 2.
MUST_SURVIVE_IN=(
  "README.md"                               # 미러에만 있는 pim-package 바이너리 안내 문단
  "make-for-imx8"                           # 미러 판이 아직 안 받은 구식 종료 처리 한 줄 (전체 검색으로는 무효 — 위 주의 참조). **뒤처짐 앵커** — 아래 [알려진 공백] (1)
  "docs/pim-package-binary.md"              # MIRROR_ONLY 파일의 결론 문장
  "docs/team-sharing-build-guide.md"        # MIRROR_ONLY 파일의 제목 줄
)

# ── 알려진 공백 — 앵커는 3/3 이지만 그중 하나는 유효기간이 있다 ──────────────
# README 의 "새 쌍 추가" 절차는 `KEEP_MIRROR` 항목마다 `MUST_SURVIVE` 또는 `FORBID`
# 중 하나로 앵커하라고 정한다. 3개 전부 지켰다 —
#   .gitignore    → FORBID ".cache/"   ("덮이면 나타난다" 방향)
#   make-for-imx8 → MUST_SURVIVE 2)번 (파일 구속) — 아래 (1) 주의
#   README.md     → MUST_SURVIVE 1)번 (파일 구속)
#
# 그래도 남는 공백이 둘 있다. 낙관적으로 읽지 마라.
#
# (1) **MUST_SURVIVE 2)번은 '미러 고유 서술' 이 아니라 '미러가 아직 upstream 수정을 못
#     받았다' 는 뒤처짐 자체를 앵커한다.** 위 KEEP_MIRROR 주석이 지시하는 수동 이식을
#     실제로 수행하면(upstream 의 source-안전 종료 수정을 미러 make-for-imx8 에 옮기면)
#     그 줄이 `[ -d "$SRC_DIR" ] || { echo …; "$_mfi_end" 1; }` 로 바뀌어 이 문자열이
#     0건이 되고, 이후 모든 --apply 가 ASSERT_C_MUST_SURVIVE_LOST 로 종료 코드 4 를
#     낸다 — 미러 내용에는 아무 문제가 없는데 conf 를 고치기 전까지 싱크가 영구히 막힌다.
#     **make-for-imx8 을 이식하면 MUST_SURVIVE 2)번과 MUST_SURVIVE_IN 2)번을 같이 지워라.**
#     형제 conf 4장의 MUST_SURVIVE 는 전부 미러의 정책적 고유 문장(내부 경로 제거·미러
#     범위 서술·스크립트 개명)이라 미러가 upstream 을 따라잡아도 바뀌지 않는다. 이 항목만
#     '바뀌어야 정상인 줄' 을 앵커한다. 대체 방향은 make-for-imx8 도 FORBID 쪽으로 옮기는
#     것이다(upstream:make-for-imx8 에만 있고 미러 0건인 문자열, 예: `_mfi_end`) — 단 그
#     경우에도 이식한 줄이 그 문자열을 담고 있으면 같은 오탐이 나므로 이식 시 함께 본다.
#
# (2) **죽은 패턴 경고는 오타만 잡고 '줄 빠짐' 은 잡지 못한다.** warn_unmatched_patterns()
#     는 *선언된* 패턴 중 어느 트리와도 매칭하지 않는 것을 열거한다. 그래서 KEEP_MIRROR
#     에서 줄이 통째로 빠지면 검사할 패턴 자체가 없어 경고가 **0줄**이다(2026-09-05 실측:
#     `.gitignore` 줄 삭제 후 dry-run 의 [주의] 는 빈 축 경고뿐이고 죽은 패턴 경고는 없었다).
#     오타로 매칭이 깨진 경우에만 경고가 뜬다. 줄이 빠졌을 때 남는 것은 위 어서션 앵커와
#     dry-run 표의 보존 건수를 사람이 대조하는 것뿐이다.
