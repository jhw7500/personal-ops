# pim-summit-backports 큐레이션 규칙 — bin/mirror-sync.sh 가 source 하는 bash 조각
# 2026-09-12: upstream master 39fb8df 의 빌드 변경을 mirror develop 에 이식한다.
# 반영 전 mirror 는 badf083. 공통 분기점은 6605bac 다.
# shellcheck shell=bash
# shellcheck disable=SC2034
#
# 이번에 .clangd / .env.example / .gitignore / env.sh / make-for-imx8 을 upstream 과
# 같게 맞췄다. README 는 미러 바이너리 안내와 호스트 설정 설명을 유지하며,
# 미러 전용 문서 두 개는 계속 보존한다. 반영 후 upstream 8개 / mirror 10개,
# 공통 8개 중 내용이 다른 파일은 README.md 하나다.
#
# 2026-09-05 규칙의 .gitignore / make-for-imx8 보존은 정책적 차이가 아니라
# 아직 받지 않은 clangd 수정에 대한 임시 장치였다. 이제 둘 다 일반 복사 대상이다.
# .gitignore 의 ".cache/" 금지와 make-for-imx8 의 구식 "exit 1" 필수 문자열을
# 남기면 정상 이식 후 어서션이 실패하므로 함께 제거한다. 당시 조사 이력은
# mirror-sync/README.md 의 2026-09-05 절과 Git 이력에 남아 있다.
#
# 경로 패턴: ** 는 / 포함 임의 문자열, * 는 / 를 넘지 않는 임의 문자열,
# ? 는 / 아닌 한 글자. 나머지는 리터럴이며 경로 전체에 매칭한다.
# 우선순위: UPSTREAM_ONLY > MIRROR_ONLY > KEEP_MIRROR > 일반 복사.

KEEP_MIRROR=(
  "README.md" # 미러 전용 바이너리 안내와 .env 사용 설명을 수동 이식한다
)

# 반입을 금지할 upstream 전용 파일은 없다. .clangd 와 .env.example 도 반입한다.
UPSTREAM_ONLY=()

MIRROR_ONLY=(
  "docs/pim-package-binary.md"
  "docs/team-sharing-build-guide.md"
)

# .cache/ 는 이제 양쪽 .gitignore 의 정상 내용이다. 나머지 upstream 파일도
# 동일하게 반입하므로 금지할 문자열 후보가 없다. 추측으로 새 금지어를 넣지 않는다.
FORBID=()
AXES_INTENTIONALLY_EMPTY=( UPSTREAM_ONLY FORBID )

# 미러 고유 문장만 남긴다. 빌드 스크립트의 과거 종료 방식은 보존하지 않는다.
MUST_SURVIVE=(
  "(docs/pim-package-binary.md)에 구분해 기록한다"
  "이 저장소의 현재 빌드 기준은 PIM 양산 커널"
  "타팀 저장소 공유 및 빌드 안내"
)
MUST_SURVIVE_IN=(
  "README.md"
  "docs/pim-package-binary.md"
  "docs/team-sharing-build-guide.md"
)

# 알려진 공백:
# - ASSERT_A/B 는 검사 대상이 0개다. 경로/문자열 유입을 검사했다고 해석하면 안 된다.
# - 신규 파일은 ASSERT_F 의 --allow-new 확인을 거치지만, 기존 일반 복사 파일에
#   새 내용이 들어오는 것은 막지 않는다. 그 내용은 커밋 리뷰에서 확인해야 한다.
# - README 의 고유 안내는 파일에 묶은 ASSERT_C, 문서 존재는 ASSERT_D 가 지킨다.
# - 선언된 패턴의 오타 경고는 목록에서 항목 자체가 빠지는 경우를 잡지 못한다.
#   그때도 문서에 묶은 세 필수 문자열 검사는 남는다.
