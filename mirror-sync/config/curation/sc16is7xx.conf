# sc16is7xx 큐레이션 규칙 — bin/mirror-sync.sh 가 source 하는 bash 조각
# 실측일 2026-09-05 (personal-ops 이슈 #34 의 예고된 후속 — 두 번째 쌍).
#
# shellcheck shell=bash
# shellcheck disable=SC2034  # 다섯 축은 이 파일을 source 하는 bin/mirror-sync.sh 가 소비한다
#
# ── 기준 커밋 ────────────────────────────────────────────────────────────────
# upstream /home/jhw/ai/opencode/projects/sc16is7xx        master  093e069  (22개 파일)
# mirror   /home/jhw/ai/opencode/projects/sc16is7xx-gitlab main    6c09f62  ( 9개 파일)
# 양쪽 다 origin/HEAD 가 로컬 체크아웃과 일치하고(upstream origin/HEAD=origin/master,
# mirror origin/HEAD=origin/main) 로컬과 origin 이 0/0 으로 어긋나지 않았다.
# 즉 브랜치 선택에 모호함이 없었다 — pairs.tsv 6·7 컬럼은 master / main 이다.
#
# ── 형식: max9296.conf 와 같은 bash 배열 ─────────────────────────────────────
# max9296 은 경로에 공백·괄호·& ·= 가 들어간 파일이 3개라 배열이 **필수**였다.
# 이 저장소에는 그런 경로가 하나도 없다(22+9개 전부 [A-Za-z0-9._/-] 만 쓴다).
# 그래도 배열을 쓴다 — 스크립트가 declare -p 로 선언 타입을 검사해 배열이 아니면
# 종료 코드 2 로 거부하기 때문이다. 문자열로 쓰면 축이 항목 1개로 퇴화해 아무것도
# 매칭하지 않은 채 조용히 전량 복사된다. 새 항목은 반드시 따옴표로 감싼다.
#
# ── 경로 매칭 규칙 (스크립트 glob_to_ere() 와 문자 그대로 일치) ───────────────
#   *        경로 구분자 '/' 를 넘지 않는 임의 문자열   (ERE [^/]*)
#   **       '/' 를 포함한 임의 문자열                  (ERE .*)
#   ?        '/' 가 아닌 한 글자                        (ERE [^/])
#   그 외    전부 리터럴.
#   패턴은 경로 **전체**에 앵커된다(^...$). 부분 문자열 매칭이 아니다.
#   디렉터리 전체는 '.github/**' 처럼 '/**' 를 붙여야 한다.
#
# ── 분류 우선순위 (스크립트 classify_path() 와 일치) ─────────────────────────
#   UPSTREAM_ONLY > MIRROR_ONLY > KEEP_MIRROR > (그 외) 복사
#   아래 세 축은 실측상 서로 겹치지 않는다(교차 매칭 0건을 glob_to_ere 로 확인).
#
# ── 이 쌍의 성격: max9296 과 다른 점 ─────────────────────────────────────────
# max9296 은 KEEP_MIRROR 6개 **전부**에 MUST_SURVIVE 문자열을 1:1 로 붙일 수 있었다.
# 여기서는 못 한다. KEEP_MIRROR 3개 중 2개(.gitignore / make-for-imx8)의 미러 판이
# upstream 판의 **순수 부분집합**이기 때문이다 — 큐레이션이 "덜어내기"만 했고 미러
# 고유 문장을 넣지 않았다. 미러에만 있는 문자열이 존재하지 않으므로 그 두 파일에는
# MUST_SURVIVE 를 걸 방법이 원리적으로 없다.
# 대신 그 두 파일은 **FORBID 가 대칭으로 막는다**: 미러 판이 upstream 판으로 덮이는
# 순간 "clangd" / "compile_commands.json" 이 미러에 나타나고 ASSERT_B 가 빨개진다.
# (실측 확인: upstream 의 .gitignore·make-for-imx8 blob 둘 다 두 문자열을 포함한다.
#  미러 전체 매치는 0건이다. 즉 되돌리면 실패하는 어서션이다.)

# ── KEEP_MIRROR — 양쪽에 다 있으나 내용이 의도적으로 다름 ────────────────────
# 덮어쓰기 금지. upstream 변경분은 사람이 읽고 수동 이식한다.
# 실측: 공통 8개 중 blob sha 가 다른 것이 정확히 아래 3개다
# (같은 5개: Makefile · README.md · sc16is7xx.c · sc16is7xx.h · serial_loopback_error_rate.py).
KEEP_MIRROR=(
  ".gitignore"                                # 미러에는 clangd 산출물 무시 4줄이 없다 25줄→21줄
  "make-for-imx8"                             # 미러에는 clangd compile_commands 자동생성 블록이 없다 82줄→28줄
  "docs/sc16is752-80mhz-investigation.md"     # 워크스페이스 상대경로·저장소 밖 PDF 참조를 걷어낸 판 301줄=301줄
)

# ── UPSTREAM_ONLY — upstream 에만 존재. 미러로 반입 금지 ─────────────────────
# 실측 upstream 전용 14개를 아래 3개 패턴이 정확히 덮는다
# (검증 2026-09-05, 스크립트의 glob_to_ere 를 그대로 잘라 써서 확인:
#  upstream 전용 14/14 매치 · 미러 9개 파일 오매치 0 · 공통 8개 오매치 0).
UPSTREAM_ONLY=(
  ".clangd"                              # clangd 파싱 설정. 호스트 개발도구 전용이라 미러에 두지 않는다
  ".github/**"                           # GitHub Actions 12개(README·workflow-config·workflows/*). GitLab 미러와 무관
  "docs/sc16is7xx-ext-ko-provenance.md"  # /home/jhw/... 내부 워크스페이스 절대경로가 박힌 provenance 조사 노트
)

# ── MIRROR_ONLY — 미러에만 존재. upstream 에 없다고 삭제 금지 ────────────────
# 실측 1개. 위 provenance 노트의 **미러용 대체본**이다 — 내부 절대경로와 조사 과정을
# 걷어내고 "회사 패키지 기준값" 만 남긴 판이라 upstream 에 대응 파일이 없다.
MIRROR_ONLY=(
  "docs/pim-package-binary.md"  # 미러 커밋 519dc49/4d54eba 가 만든 미러 전용 문서. upstream 에 대응 파일 없음
)

# ── FORBID — 싱크 후 미러 추적 파일에 나타나면 안 되는 문자열 ────────────────
# 고정 문자열(grep -F)로 검사한다. 정규식이 아니다.
# 넣는 기준은 max9296 과 같다 — **upstream 에는 실제로 나오고 미러에는 현재 0건**.
# 실측 2026-09-05 (git grep -l -F, upstream master / mirror main):
#   "clangd"                 upstream 3파일(.clangd/.gitignore/make-for-imx8) · 미러 0
#   "compile_commands.json"  upstream 3파일(같음)                              · 미러 0
#   "projects/sc16is7xx/"    upstream 1파일(80mhz 조사문서 3줄)                 · 미러 0
#   "/home/jhw/"             upstream 1파일(provenance 노트 6줄)                · 미러 0
#   ".github/"               upstream 11파일(전부 .github/** 자신)              · 미러 0
# max9296 의 "PR #" · "pull/" 는 넣지 않았다 — 이 저장소는 upstream 에서도 0건이라
# 죽은 항목이 된다(FORBID 는 죽은 패턴 경고가 없어 조용히 늘어나기만 한다).
FORBID=(
  "clangd"                # KEEP_MIRROR 의 .gitignore·make-for-imx8 이 upstream 판으로 덮이면 즉시 나타난다
  "compile_commands.json" # 위와 같은 사건을 다른 문자열로 한 번 더 잡는다(호스트 종속 산출물 경로)
  "projects/sc16is7xx/"   # 80mhz 조사문서의 워크스페이스 상대경로 접두사. 미러에서는 저장소 루트 기준으로 고쳐 놨다
  "/home/jhw/"            # 내부 워크스페이스 절대경로. 공개 미러로 새어나가면 안 된다
  ".github/"              # GitHub Actions 경로 참조. GitLab 미러에서 가리키는 곳이 없다
)

# ── MUST_SURVIVE — 싱크 후에도 미러에 남아 있어야 하는 문자열 ────────────────
# 고정 문자열(grep -F)로 검사한다. KEEP_MIRROR 의 보존은 "복사하지 않는다"로만
# 구현돼 있어서, 목록에서 한 줄이 빠지거나 경로가 바뀌어 매칭에 실패하는 순간
# upstream 판이 미러 판을 덮어써도 나머지 어서션이 전부 통과한다. 그 구멍을 막는 축이다.
#
# 아래 4개는 전부 docs/sc16is752-80mhz-investigation.md 의 **미러 판에만 있는** 문장이다.
# 실측 2026-09-05: 4개 모두 upstream master 전체 매치 0파일 / 미러 main 1파일 1줄.
#   line 23  워크스페이스 상대경로 접두사 제거 (upstream: `projects/sc16is7xx/sc16is7xx.c`)
#   line 34  저장소에 없는 PDF 참조를 서술로 대체 (upstream: `docs/sc126is752.pdf`)
#   line 84  서술 주체 치환 "로컬 드라이버" → "이 저장소의 드라이버"
#   line 239 line 34 와 같은 대체를 출처 표기에서 한 번 더 (upstream: `docs/sc126is752.pdf`, p.8, §7.2)
# 주의: 같은 문서 line 193 의 "로컬 드라이버가 이미 ..." 는 **양쪽에 다 있어** 쓰지 않았다.
#       양쪽에 있는 문자열은 파일이 통째로 덮여도 살아남아 소실을 감지하지 못한다.
# 나머지 KEEP_MIRROR 2개(.gitignore / make-for-imx8)는 미러 판이 upstream 판의 순수
# 부분집합이라 걸 문자열이 없다 — 위 FORBID 의 "clangd" 가 그 자리를 대신한다.
MUST_SURVIVE=(
  "- 드라이버 소스: \`sc16is7xx.c\`"
  "참고 문서: NXP SC16IS752 데이터시트(저장소 외부 참고자료)"
  "이 저장소의 드라이버는 이미 termios"
  "출처: NXP SC16IS752 데이터시트, p.8, §7.2"
)

# ── MUST_SURVIVE_IN — 위 문자열이 살아 있어야 하는 파일 (선택 축) ────────────
# MUST_SURVIVE 와 **같은 길이의 병렬 배열**이다. i 번째 원소가 MUST_SURVIVE[i] 의
# 요구 위치이고, 빈 문자열이면 저장소 전체에서 찾는다. 길이가 다르면 종료 코드 2.
# 네 문자열이 전부 한 파일에서 나왔으므로 전부 같은 경로에 못박는다 — 저장소 전체
# 검사로 두면 같은 문구가 다른 파일에 우연히 생겼을 때 정작 그 문단의 소실을 놓친다.
MUST_SURVIVE_IN=(
  "docs/sc16is752-80mhz-investigation.md"  # line 23  드라이버 소스 경로(저장소 루트 기준)
  "docs/sc16is752-80mhz-investigation.md"  # line 34  참고 문서 — 저장소 외부 자료임을 밝힌 미러 전용 서술
  "docs/sc16is752-80mhz-investigation.md"  # line 84  "이 저장소의 드라이버" 로 바꾼 미러 전용 서술
  "docs/sc16is752-80mhz-investigation.md"  # line 239 출처 표기의 PDF 참조 대체
)
