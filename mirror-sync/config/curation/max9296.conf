# max9296 큐레이션 규칙 — bin/mirror-sync.sh 가 source 하는 bash 조각
# 실측일 2026-09-04 (personal-ops 이슈 #34).
#
# shellcheck shell=bash
# shellcheck disable=SC2034  # 다섯 축은 이 파일을 source 하는 bin/mirror-sync.sh 가 소비한다
#
# ── 형식을 bash 배열로 고른 이유 ──────────────────────────────────────────────
# 이 저장소에는 **경로에 공백·괄호·& ·= 가 실제로 들어 있는 파일이 3개** 있다:
#     docs/AND9230-D (AP1302 RR)_PointImage.pdf
#     docs/AND9812-D (AR0234CS RR)=R2_PointImage.pdf
#     docs/GMSL2_CANTOPS_MAX9296B DS & Reg Doc (rev3).pdf
# 이슈 본문 예시처럼 축을 "공백 구분 문자열 하나"로 두면 이 3개가 단어 분할로
# 조각나 매칭에서 통째로 빠진다 — 그리고 그 실패는 조용하다(에러 없이 "미반입 아님"
# 으로 분류돼 미러에 유입된다). 개행 구분 문자열도 가능하지만 배열이 더 낫다고 봤다:
#   (1) 항목 경계가 따옴표로 명시돼 공백·개행 어느 쪽에도 의존하지 않는다,
#   (2) 항목마다 근거 주석을 바로 옆 줄에 달 수 있다,
#   (3) 스크립트에서 "${ARR[@]}" 한 번으로 안전하게 순회된다.
# 따라서 다섯 축 전부 bash 배열이다. 새 항목은 반드시 따옴표로 감싼다.
# 스크립트가 이 파일을 source 하기 전에 다섯 축을 unset 하고 source 직후 declare -p 로
# **선언 타입**을 확인한다. 배열이 아니면 종료 코드 2 로 거부한다 — 길이만 보면
# X="a b c" 가 "항목 1개짜리 축"으로 통과해 버리고, 그 1개는 어떤 경로와도 매칭하지
# 않으므로 다섯 축이 전부 죽은 채 조용히 전량 복사된다.
#
# ── 경로 매칭 규칙 (스크립트 glob_to_ere() 와 문자 그대로 일치) ───────────────
#   *        경로 구분자 '/' 를 넘지 않는 임의 문자열   (ERE [^/]*)
#   **       '/' 를 포함한 임의 문자열                  (ERE .*)
#   ?        '/' 가 아닌 한 글자                        (ERE [^/])
#   그 외    전부 리터럴. 공백·괄호·& ·= 도 리터럴로 취급한다.
#   패턴은 경로 **전체**에 앵커된다(^...$). 부분 문자열 매칭이 아니다.
#   따라서 디렉터리 전체는 'artifacts/**' 처럼 '/**' 를 붙여야 하고,
#   'artifacts' 만 쓰면 'artifacts' 라는 이름의 파일 하나만 매칭한다.
#   KEEP_MIRROR / UPSTREAM_ONLY / MIRROR_ONLY 세 축 모두 같은 규칙을 쓴다.
#
# ── 분류 우선순위 (스크립트 classify_path() 와 일치) ─────────────────────────
#   UPSTREAM_ONLY > MIRROR_ONLY > KEEP_MIRROR > (그 외) 복사
#   세 축은 실측상 서로 겹치지 않지만, 겹칠 경우의 동작을 못박아 둔다.

# ── KEEP_MIRROR — 양쪽에 다 있으나 내용이 의도적으로 다름 ────────────────────
# 덮어쓰기 금지. upstream 변경분은 사람이 읽고 수동 이식한다.
# 실측: 공통 64개 중 내용이 다른 6개가 정확히 이 목록이다.
KEEP_MIRROR=(
  ".gitignore"                              # 미러는 upstream 의 artifacts/ 무시 규칙 등이 빠져 45줄→41줄
  "README.md"                               # 내부 계획문서·PR 참조를 걷어낸 서술 244줄→240줄
  "docs/360p-readout-120fps-validation.md"  # 미러 전용 "증적 위치" 문단 보유(2026-09-04 사고 당사자) 537줄→541줄
  "docs/prepare-board-gate-v1.md"           # 보드 원시 캡처 경로 참조를 제거한 판 196줄→194줄
  "dw100-spike/REPORT.md"                   # 줄 수는 같으나 내용이 다름(내부 참조 치환) 102줄=102줄
  "tools/cam_prepare_gate.sh"               # 미러에서 내부 전용 경로 한 줄이 빠짐 560줄→559줄
)

# ── UPSTREAM_ONLY — upstream 에만 존재. 미러로 반입 금지 ─────────────────────
# 실측 277개를 아래 19개 패턴이 정확히 덮는다(검증: upstream 전용 277/277 매치,
# 미러 65개 파일 중 오매치 0). **이슈 본문 목록은 불완전하므로 이 실측을 따른다** —
# 이슈는 PDF 6개와 docs/ 직속 md 6개, docs/examples/** 를 빠뜨렸다.
UPSTREAM_ONLY=(
  "artifacts/**"                                    # 보드 원시 캡처. 미러에 두지 않는 것이 정책
  ".github/**"                                      # GitHub Actions·PR 템플릿. GitLab 미러와 무관
  ".gitattributes"                                  # upstream LFS/diff 설정. 미러에 없음
  "docs/superpowers/**"                             # 내부 계획·방법론 문서(FORBID 문자열의 출처)
  "docs/reports/**"                                 # 내부 세션 리포트
  "docs/examples/**"                                # upstream 전용 예제 모음
  "docs/AND9230-D (AP1302 RR)_PointImage.pdf"       # 벤더 데이터시트. 공백·괄호 포함 경로
  "docs/AND9812-D (AR0234CS RR)=R2_PointImage.pdf"  # 벤더 데이터시트. 공백·괄호·'=' 포함 경로
  "docs/AR0234-register-access.md"                  # 센서 레지스터 내부 조사 노트
  "docs/AR0234-register-access-quickstart.md"       # 위 문서의 요약본
  "docs/GMSL2_CANTOPS_MAX9296B DS & Reg Doc (rev3).pdf"  # 벤더 데이터시트. 공백·'&'·괄호 포함 경로
  "docs/GMSL2-sensor-access-overview.md"            # 내부 조사 개요
  "docs/MAX9295A_DS_NEXTCHIP.PDF"                   # 벤더 데이터시트(대문자 확장자 그대로)
  "docs/MAX9295A_ES3_DS_17NOV2017_Partron.pdf"      # 벤더 데이터시트
  "docs/MAX9295A_Registers_ES3_CAMMSYS.pdf"         # 벤더 레지스터 문서
  "docs/MCP4018T-503E.pdf"                          # 벤더 데이터시트
  "docs/SIPM-register-access.md"                    # 내부 조사 노트
  "docs/session-2026-08-10-worklog.md"              # 세션 작업 로그(내부 기록)
  "docs/v4l2-controls-guide.md"                     # upstream 전용 가이드(이슈 본문에도 있던 항목)
)

# ── MIRROR_ONLY — 미러에만 존재. upstream 에 없다고 삭제 금지 ────────────────
# 실측 1개.
MIRROR_ONLY=(
  "docs/pim-package-binary.md"  # 미러 쪽에서만 유지하는 바이너리 패키지 안내. upstream 에 대응 파일 없음
)

# ── FORBID — 싱크 후 미러 추적 파일에 나타나면 안 되는 문자열 ────────────────
# 고정 문자열(grep -F)로 검사한다. 정규식이 아니다.
# 실측: 현재 미러 매치 0건.
FORBID=(
  "docs/superpowers/"  # 미러에 없는 내부 문서 경로 참조 — 링크가 깨지고 내부 구조가 새어나간다
  "PR #"               # GitHub PR 번호 참조. GitLab 미러에서 가리키는 곳이 없다
  "pull/"              # GitHub pull request URL 조각. 위와 같은 이유
)

# ── MUST_SURVIVE — 싱크 후에도 미러에 남아 있어야 하는 문자열 ────────────────
# 고정 문자열(grep -F)로 검사한다. **이번 사고를 직접 막는 축이다.**
# 2026-09-04 커밋 219f877 이 docs/360p-readout-120fps-validation.md 의 "증적 위치"
# 문단을 덮어써 지웠고, 복사도 테스트도 전부 통과해 git diff 삭제 줄을 뒤져서야
# 발견됐다.
#
# ── KEEP_MIRROR 6개 전부에 하나씩 대응시킨다 ─────────────────────────────────
# KEEP_MIRROR 의 보존은 "복사하지 않는다"로만 구현돼 있다. 그래서 그 목록에서
# 한 줄이 빠지거나 오타·경로 변경으로 매칭에 실패하는 순간, upstream 판이 미러
# 판을 덮어써도 어서션이 전부 통과한다 — 2026-09-04 사고와 같은 모양이다.
# 아래 6개 문자열은 각 KEEP_MIRROR 파일의 **미러 판에만 있고 upstream 판에는
# 없는** 문장이다(2026-09-04 실측: 6개 모두 upstream 전체 매치 0건, 미러 1건).
# 따라서 그 파일이 upstream 판으로 덮이는 순간 ASSERT_C 가 빨개진다.
MUST_SURVIVE=(
  "증적 위치"
  "대상 저장소는 여기 포함되지 않으므로"
  "Board qualification artifacts stay out of this curated mirror entirely"
  "MAX9296 병렬 prepare ABI를 실보드에서 검증하는 절차와 그 실측값이다"
  "설계 선택: DWE 하드웨어 경로의 5.10 BSP 이식 가능성을 먼저 검증"
  "docs/prepare-board-gate-v1.md 가 정의한 네 가지를 실측한다"
)

# ── MUST_SURVIVE_IN — 위 문자열이 살아 있어야 하는 파일 (선택 축) ────────────
# MUST_SURVIVE 와 **같은 길이의 병렬 배열**이다. i 번째 원소가 MUST_SURVIVE[i] 의
# 요구 위치이고, 빈 문자열이면 저장소 전체에서 찾는다.
# 경로를 묶는 이유: 저장소 전체 검사는 "같은 문구가 다른 파일에 우연히 생기면"
# 정작 그 문단이 지워져도 통과한다. 이 축이 지키려는 것은 "문구의 존재"가 아니라
# "그 파일의 미러 고유 서술"이므로 파일에 못박는다.
# 길이가 다르면 스크립트가 종료 코드 2 로 거부한다.
MUST_SURVIVE_IN=(
  "docs/360p-readout-120fps-validation.md"  # 원시 캡처를 저장소에 두지 않는 정책 문단
  "README.md"                               # 미러 범위를 명시하는 미러 전용 서술
  ".gitignore"                              # artifacts/ 제외 규칙과 그 근거 주석
  "docs/prepare-board-gate-v1.md"           # 내부 계획서 참조를 걷어낸 미러 판 도입부
  "dw100-spike/REPORT.md"                   # 내부 설계문서 참조를 대체한 한 줄
  "tools/cam_prepare_gate.sh"               # 내부 계획서 대신 공개 문서를 가리키는 주석
)
