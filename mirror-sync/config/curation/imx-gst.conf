# imx-gst 큐레이션 규칙 — bin/mirror-sync.sh 가 source 하는 bash 조각
# 2026-11-06 (이슈 #72): upstream master ed36938 의 큐레이션 스냅샷으로 GitLab 미러를 시작했다.
# 미러에는 upstream 이력이 없다. GitLab 에는 빌드에 쓰는 소스·빌드 파일과 그 문서만 둔다
# (mirror-sync/README.md 의 "GitLab 최소화" 절).
# shellcheck shell=bash
# shellcheck disable=SC2034
#
# 미러는 upstream 트리에서 CHANGELOG.md 를 빼고 README.md 를 미러판으로 바꾼 것이다(나머지 1538개는
# upstream 과 같다). 소스 트리(gst-rtsp-server/, gst-plugins-good/)는 meson 빌드가 tests·docs·po 를
# 함께 읽으므로 통째로 둔다. 그 안의 192.168.x 주소는 GStreamer 원본 예제·테스트의 것이고 보드 대역이
# 아니다.
#
# 경로 패턴: ** 는 / 포함 임의 문자열, * 는 / 를 넘지 않는 임의 문자열,
# ? 는 / 아닌 한 글자. 나머지는 리터럴이며 경로 전체에 매칭한다.
# 우선순위: UPSTREAM_ONLY > MIRROR_ONLY > KEEP_MIRROR > 일반 복사.

KEEP_MIRROR=(
  "README.md" # GitHub 링크를 빼고, 이력 없는 스냅샷에 맞지 않는 커밋·git log 안내를 고친 미러판
)

UPSTREAM_ONLY=(
  "CHANGELOG.md" # 아무도 인용하지 않는 변경 이력(imx-vpu 와 같은 처리)
)

# 미러에만 있는 파일이 없다. 조사한 뒤 비운 축이다.
MIRROR_ONLY=()
AXES_INTENTIONALLY_EMPTY=( MIRROR_ONLY )

# 보드 사설 주소 대역(모든 쌍 공통)과 GitHub 저장소 링크. 뒤의 것은 upstream 에서 README.md 에만 있어,
# upstream README 가 미러판을 덮으면 ASSERT_B 가 잡는 앵커다.
FORBID=(
  "192.168.214."
  "github.com/jhw7500"
)

# 미러판 README 에만 있는 문장이다.
MUST_SURVIVE=(
  '모듈마다 `UPSTREAM.md` 의 표가 수정 목록이다.'
)
MUST_SURVIVE_IN=(
  "README.md"
)
