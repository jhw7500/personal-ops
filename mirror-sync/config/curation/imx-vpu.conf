# imx-vpu 큐레이션 규칙 — bin/mirror-sync.sh 가 source 하는 bash 조각
# 실측일 2026-09-05 (personal-ops 이슈 #34 의 예고된 후속 — 두 번째 쌍).
#
# shellcheck shell=bash
# shellcheck disable=SC2034  # 다섯 축은 이 파일을 source 하는 bin/mirror-sync.sh 가 소비한다
#
# ── 기준 브랜치 (축을 잰 커밋) ───────────────────────────────────────────────
#   upstream /home/jhw/ai/opencode/projects/imx-vpu         master  87deeb7
#   mirror   /home/jhw/ai/opencode/projects/imx-vpu-gitlab  main    f9e5699
# 두 저장소 모두 origin/HEAD 가 로컬 체크아웃과 일치한다
# (upstream origin/master, mirror origin/main). 브랜치 이름이 서로 다르므로
# pairs.tsv 의 6·7 컬럼도 master / main 으로 적는다.
# 실측 규모: upstream 312개 · mirror 288개 · 공통 287개.
#
# ── 형식을 bash 배열로 고른 이유 ──────────────────────────────────────────────
# max9296.conf 와 같다. 이 저장소에도 **공백이 들어간 경로가 1개** 있다:
#     imx-gst1.0-plugin/doc/design/v4l2 source.jpg
# 이 파일은 양쪽에 같은 내용으로 있어서 아래 세 경로 축 어디에도 들어가지 않지만,
# 축을 "공백 구분 문자열 하나"로 두면 앞으로 이런 경로를 축에 넣는 순간 단어
# 분할로 조각나 매칭에서 통째로 빠진다 — 그리고 그 실패는 조용하다.
# 스크립트가 source 직전에 다섯 축을 unset 하고 직후 declare -p 로 **선언 타입**을
# 확인해 배열이 아니면 종료 코드 2 로 거부한다. 새 항목은 반드시 따옴표로 감싼다.
#
# ── 경로 매칭 규칙 (스크립트 glob_to_ere() 와 문자 그대로 일치) ───────────────
#   *        경로 구분자 '/' 를 넘지 않는 임의 문자열   (ERE [^/]*)
#   **       '/' 를 포함한 임의 문자열                  (ERE .*)
#   ?        '/' 가 아닌 한 글자                        (ERE [^/])
#   그 외    전부 리터럴. 공백·'~' 도 리터럴로 취급한다('~'는 ERE 메타문자가 아니다).
#   패턴은 경로 **전체**에 앵커된다(^...$). 부분 문자열 매칭이 아니다.
#   따라서 디렉터리 전체는 '.github/**' 처럼 '/**' 를 붙여야 하고,
#   '.github' 만 쓰면 '.github' 라는 이름의 파일 하나만 매칭한다.
#   KEEP_MIRROR / UPSTREAM_ONLY / MIRROR_ONLY 세 축 모두 같은 규칙을 쓴다.
#
# ── 분류 우선순위 (스크립트 classify_path() 와 일치) ─────────────────────────
#   UPSTREAM_ONLY > MIRROR_ONLY > KEEP_MIRROR > (그 외) 복사
#   세 축은 실측상 서로 겹치지 않지만, 겹칠 경우의 동작을 못박아 둔다.
#
# ── 이 쌍의 큐레이션 축이 무엇인가 (한 문장) ─────────────────────────────────
# 미러는 upstream 의 **제품 소스 전체(imx-gst1.0-plugin 243개 + imx-vpuwrap 38개)를
# 그대로** 담고, GitHub 자동화(.github/)와 clangd 개발 도구 배선, 잘못 추적된
# autotools/SDK 생성물만 걷어낸 판이다. 여기에 더해 **빌드 스크립트 이름이 서로
# 다르다** — upstream 은 make-for-imx8.sh, 미러는 build.sh 다. 내용이 다른 공통
# 파일 5개 중 **4개**(.gitignore · CHANGELOG.md · README.md · update_bin.sh)가 이 두
# 가지(clangd 제거 / 스크립트 이름)에서 나오고, 나머지 **docs/pim-package-binary.md
# 1개는 둘 중 어느 것도 아니다** — provenance·재현빌드·패키지 위치 절을 통째로 걷어낸
# 별개의 축약 정책이다(93줄→40줄. 아래 KEEP_MIRROR 항목 주석 참조).
# 이 파일을 "스크립트 이름만 다른 파일"로 오인해 upstream 판을 그대로 수동 이식하면
# 미러 전용 축약 정책 53줄이 사라진다. 수동 이식은 --apply 를 거치지 않아
# ASSERT_B/ASSERT_C 가 돌지 않으므로 조용히 지나간다.
#
# ── 알려진 제약: 심볼릭 링크 2개 ─────────────────────────────────────────────
# imx-vpuwrap/COPYING(→ docs/EULA.txt)·imx-vpuwrap/INSTALL(→ /usr/share/automake-1.11/
# INSTALL)은 양쪽 모두 모드 120000 인 심볼릭 링크인데(ls-tree 실측), 다섯 축 어디에도
# 걸리지 않아 classify_path 가 기본값 COPY 로 분류한다. 스크립트는 복사 대상의 모드를
# 100644/100755 로만 허용하므로, upstream 이 이 둘 중 하나의 링크 대상을 바꾸면
# (automake 버전 변경 등) --apply 가 "지원하지 않는 파일 모드(120000)" 로 **종료 코드
# 5** 를 내고 이 쌍의 싱크가 통째로 막힌다. 파일을 쓰기 전 단계라 미러 워킹트리는
# 손상되지 않는다 — 그때는 두 파일을 수동 처리한다.
# 현재는 잠복 상태다: 두 경로 모두 루트 커밋 d8e9590 이후 변경 이력이 없고
# (git log --all -- 두 경로 → d8e9590 한 줄), 양쪽 blob sha 도 동일하다.

# ── KEEP_MIRROR — 양쪽에 다 있으나 내용이 의도적으로 다름 ────────────────────
# 덮어쓰기 금지. upstream 변경분은 사람이 읽고 수동 이식한다.
# 실측: 공통 287개 중 blob sha 가 다른 것이 정확히 아래 5개다(나머지 282개는 동일).
KEEP_MIRROR=(
  ".gitignore"                 # 미러에는 clangd 무시 규칙(compile_commands.json·.cache/)이 없다 50줄→46줄
  "CHANGELOG.md"               # 빌드 스크립트 이름만 다르다: make-for-imx8.sh → build.sh (17줄=17줄)
  "README.md"                  # 같은 이름 치환 5곳(표·사용법·주의). 그 외 동일 74줄=74줄
  "docs/pim-package-binary.md" # 미러 전용 축약판. provenance/재현빌드 절을 걷어낸 "기준" 문서 93줄→40줄
  "update_bin.sh"              # 오류 메시지의 스크립트 이름 한 곳만 다르다 38줄=38줄
)

# ── UPSTREAM_ONLY — upstream 에만 존재. 미러로 반입 금지 ─────────────────────
# 실측 25개를 아래 4개 패턴이 정확히 덮는다.
# 검증(2026-09-05): 네 패턴의 upstream 매치 합 = 25/25, **미러 288개 파일에 대한
# 오매치 0**. 미러에는 .github/ 도, '~' 로 끝나는 파일도, libtool 산출물도 없다.
UPSTREAM_ONLY=(
  ".github/**"                             # GitHub Actions·workflow 설정 19개. GitLab 미러와 무관
  "imx-vpuwrap/*~"                         # autotools 백업본 4개(config.guess~ config.h.in~ config.sub~ configure~)
  "imx-vpuwrap/aarch64-poky-linux-libtool" # Yocto SDK 가 만든 libtool. 잘못 추적된 빌드 산출물
  "make-for-imx8.sh"                       # 미러에서는 같은 스크립트를 build.sh 로 유지한다(MIRROR_ONLY 참조)
)

# ── MIRROR_ONLY — 미러에만 존재. upstream 에 없다고 삭제 금지 ────────────────
# 실측 1개.
MIRROR_ONLY=(
  "build.sh"  # upstream make-for-imx8.sh 에 대응하는 미러 판 빌드 스크립트. clangd 갱신 블록이 빠져 있다
)

# ── FORBID — 싱크 후 미러 추적 파일에 나타나면 안 되는 문자열 ────────────────
# 고정 문자열(grep -F)로 검사한다. 정규식이 아니다.
# 실측(2026-09-05): 네 문자열 모두 **미러 매치 0건**.
#
# 오탐이 나지 않는 근거 — 각 문자열을 담고 있는 upstream 파일이 전부
# UPSTREAM_ONLY 이거나 KEEP_MIRROR 라서, 정상 싱크에서 '복사' 로 분류되는 파일에는
# 하나도 들어 있지 않다:
#   make-for-imx8.sh      → .github/copilot-instructions.md, .github/workflow-config.yml
#                           (UPSTREAM_ONLY) / CHANGELOG.md, README.md, update_bin.sh (KEEP_MIRROR)
#   compile_commands.json → .gitignore (KEEP_MIRROR) / make-for-imx8.sh (UPSTREAM_ONLY)
#   clangd                → .gitignore, docs/pim-package-binary.md (KEEP_MIRROR) /
#                           make-for-imx8.sh (UPSTREAM_ONLY)
#   .github/              → .github/ 아래 17개 (UPSTREAM_ONLY) /
#                           docs/pim-package-binary.md (KEEP_MIRROR)
# 즉 이 축은 "KEEP_MIRROR 5개가 upstream 판으로 덮이는 사고"를 한 겹 더 잡는다.
FORBID=(
  "make-for-imx8.sh"       # 미러의 스크립트 이름은 build.sh 다. 이 이름이 보이면 upstream 판이 덮인 것
  "compile_commands.json"  # 미러는 clangd 배선을 두지 않는다. .gitignore 가 덮이면 여기서 걸린다
  "clangd"                 # 위와 같은 이유. docs/pim-package-binary.md 의 upstream 판도 이 단어를 담는다
  ".github/"               # 미러에 없는 GitHub 자동화 경로 참조 — 링크가 깨지고 내부 구조가 새어나간다
)

# ── MUST_SURVIVE — 싱크 후에도 미러에 남아 있어야 하는 문자열 ────────────────
# 고정 문자열(grep -F)로 검사한다. KEEP_MIRROR 가 "복사하지 않는다"로만 구현돼
# 있으므로, 그 목록에서 한 줄이 빠지거나 오타·경로 변경으로 매칭에 실패하면
# upstream 판이 미러 판을 덮어써도 어서션이 전부 통과한다 — 2026-09-04 max9296
# 사고와 같은 모양이다. 이 축이 그 구멍을 막는다.
#
# 아래 4개는 **미러 판에만 있고 upstream 판에는 없는** 줄이다
# (2026-09-05 실측: 4개 모두 upstream master 전체 매치 0 파일, 미러 main 매치 1 파일).
# 작은따옴표를 쓰는 이유: 문자열에 백틱(`)이 들어 있어 큰따옴표 안에서는 명령 치환이
# 된다. 조용히 빈 문자열로 퇴화하면 그 항목이 죽는다.
#
# ── KEEP_MIRROR 5개 중 4개에 하나씩 대응시킨다 ───────────────────────────────
# .gitignore 만 짝이 없다. 미러의 .gitignore 는 upstream 판의 **진부분집합**이라
# (upstream = 미러 + clangd 블록 4줄) 미러에만 있는 문자열이 존재하지 않는다.
# 없는 문자열을 억지로 넣으면 첫 실행부터 ASSERT_C 가 빨개진다. 대신 이 파일은
# 위 FORBID 의 "compile_commands.json"·"clangd" 가 지킨다 — upstream 판으로 덮이는
# 순간 그 두 문자열이 미러에 나타나므로 ASSERT_B 가 잡는다.
MUST_SURVIVE=(
  '| `build.sh` | 전체 빌드 (max9296의 make-for-imx8 대응) |'
  '- Yocto SDK 크로스빌드 (`build.sh`) 및 pim-package dist 배포'
  '산출물 없음 — 먼저 ./build.sh 실행'
  '변하는 패키지 커밋 ID는 특정하지 않는다'
)

# ── MUST_SURVIVE_IN — 위 문자열이 살아 있어야 하는 파일 (선택 축) ────────────
# MUST_SURVIVE 와 **같은 길이의 병렬 배열**이다. i 번째 원소가 MUST_SURVIVE[i] 의
# 요구 위치이고, 빈 문자열이면 저장소 전체에서 찾는다.
# 경로를 묶는 이유: 저장소 전체 검사는 "같은 문구가 다른 파일에 우연히 생기면"
# 정작 그 문단이 지워져도 통과한다. 이 축이 지키려는 것은 "문구의 존재"가 아니라
# "그 파일의 미러 고유 서술"이므로 파일에 못박는다.
# 길이가 다르면 스크립트가 종료 코드 2 로 거부한다.
MUST_SURVIVE_IN=(
  "README.md"                  # 14행. upstream 은 같은 자리가 `make-for-imx8.sh` 다
  "CHANGELOG.md"               # 17행. upstream 은 같은 자리가 `make-for-imx8.sh` 다
  "update_bin.sh"              # 16행. 산출물 부재 안내가 가리키는 스크립트 이름
  "docs/pim-package-binary.md" # 39행. 축약판에만 있는 "패키지 커밋 ID 를 적지 않는다" 정책 문장
)
