name: Gemini Manual Issue Triage

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage (e.g. 123)'
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      issue_title: ${{ steps.issue.outputs.title }}
      issue_body: ${{ steps.issue.outputs.body }}
    steps:
      - name: Validate issue_number
        shell: bash
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "issue_number must be a positive integer"
            exit 1
          fi

      - name: Fetch issue
        id: issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          title="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title --jq .title)"
          body="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq .body)"

          write_output() {
            local name="$1"
            local value="$2"
            local delimiter='__AUTOMATION_OUTPUT__'
            while [[ "$value" == *"$delimiter"* ]]; do
              delimiter="${delimiter}_X"
            done
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }

          write_output title "$title"
          write_output body "$body"

  triage:
    needs: prepare
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-triage.yml@49cd25b554a086e9f8684ee7c45171699ff824e1
    with:
      issue_number: ${{ inputs.issue_number }}
      issue_title: ${{ needs.prepare.outputs.issue_title }}
      issue_body: ${{ needs.prepare.outputs.issue_body }}
      repo_write_auth: github_app
      app_id: ${{ vars.APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
