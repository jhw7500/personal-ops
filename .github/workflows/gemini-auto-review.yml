name: Gemini Auto PR Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        type: number
        required: true
      force_review:
        description: Perform one authorized same-HEAD review
        type: boolean
        required: false
        default: false

jobs:
  gemini-review:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.force_review)
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-auto-review.yml@ffdf5c1ff6237502ac67296ffabb9146d623c7a6
    with:
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      force_review: ${{ github.event_name == 'workflow_dispatch' && inputs.force_review }}
      repo_write_auth: github_app
      app_id: ${{ vars.APP_ID }}
      publisher_app_id: ${{ vars.APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
