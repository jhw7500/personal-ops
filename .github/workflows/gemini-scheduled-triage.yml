name: Gemini Scheduled Issue Triage

on:
  workflow_dispatch:

jobs:
  triage:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-scheduled-triage.yml@06b0f77baa88e04001fe3f6259a994571dcf5408
    with:
      repo_write_auth: github_app
      app_id: ${{ vars.APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
