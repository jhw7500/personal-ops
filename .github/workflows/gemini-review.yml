name: Gemini Review

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        description: Pull request number
        required: true
      issue_title:
        type: string
        description: Pull request title
        required: true
      issue_body:
        type: string
        description: Pull request body
        required: true
      additional_context:
        type: string
        description: Any additional context from the request
        required: false

jobs:
  review:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-review.yml@06b0f77baa88e04001fe3f6259a994571dcf5408
    with:
      pr_number: ${{ inputs.pr_number }}
      issue_title: ${{ inputs.issue_title }}
      issue_body: ${{ inputs.issue_body }}
      additional_context: ${{ inputs.additional_context }}
      repo_write_auth: github_app
      app_id: ${{ vars.APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
