name: Gemini Manual PR Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review (e.g. 45)'
        required: true
        type: string
      additional_context:
        description: 'Optional extra context for the review prompt'
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr_title: ${{ steps.pr.outputs.title }}
      pr_body: ${{ steps.pr.outputs.body }}
    steps:
      - name: Validate pr_number
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_number must be a positive integer"
            exit 1
          fi

      - name: Fetch PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          title="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq .title)"
          body="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body)"

          write_output() {
            local name="$1"
            local value="$2"
            local delimiter='__AUTOMATION_OUTPUT__'
            while [[ "$value" == *"$delimiter"* ]]; do
              delimiter="${delimiter}_X"
            done
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }

          write_output title "$title"
          write_output body "$body"

  review:
    needs: prepare
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-review.yml@d3b102e2c1f62f6abf5a9a5a37da810e6ba3e7f5
    with:
      pr_number: ${{ inputs.pr_number }}
      issue_title: ${{ needs.prepare.outputs.pr_title }}
      issue_body: ${{ needs.prepare.outputs.pr_body }}
      additional_context: ${{ inputs.additional_context }}
      repo_write_auth: github_app
      app_id: ${{ vars.APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
