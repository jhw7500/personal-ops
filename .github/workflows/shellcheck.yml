name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if disabled'
        type: boolean
        default: false

jobs:
  shellcheck:
    name: ShellCheck Analysis
    if: ${{ github.event.inputs.force_run == 'true' || vars.SHELLCHECK_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          set -euo pipefail

          # 검사 대상은 저장소가 추적하는 모든 셸 스크립트다.
          # 이전에는 build.sh / tools / upgrade_file / docker 를 봤는데
          # personal-ops 에는 그 경로가 하나도 없어, 트리거가 걸리면
          # shellcheck 가 "파일 없음" 으로 항상 실패했다.
          mapfile -d '' -t files < <(git ls-files -z '*.sh')

          if [ ${#files[@]} -eq 0 ]; then
            echo "검사할 셸 스크립트가 없다."
            exit 0
          fi

          echo "Checking ${#files[@]} files..."
          shellcheck -x -s bash -S error -f gcc "${files[@]}"

      - name: Summary
        if: always()
        run: |
          echo "## ShellCheck Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ShellCheck analysis completed." >> $GITHUB_STEP_SUMMARY
