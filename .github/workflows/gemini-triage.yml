name: Gemini Triage

on:
  workflow_call:
    inputs:
      issue_number:
        type: string
        description: Issue number
        required: true
      issue_title:
        type: string
        description: Issue title
        required: true
      issue_body:
        type: string
        description: Issue body
        required: true
      additional_context:
        type: string
        description: Any additional context from the request
        required: false

jobs:
  triage:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-triage.yml@87b6e774aa67f2d280f1ce405c562dcb04e6b3d4
    with:
      issue_number: ${{ inputs.issue_number }}
      issue_title: ${{ inputs.issue_title }}
      issue_body: ${{ inputs.issue_body }}
      additional_context: ${{ inputs.additional_context }}
      repo_write_auth: github_app
      app_id: ${{ vars.APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
