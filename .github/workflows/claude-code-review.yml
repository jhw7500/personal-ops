name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    if: ${{ github.event.pull_request.head.repo.fork == false && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/claude-code-review.yml@abf5e65cf6188277d9984be062d0b069c82cf25f
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
